<style>
  :root{
    --fundo:#d6e8f7;
    --caixa:#eaf3fb;
    --mancha-1:#ffffff;
    --mancha-2:#c9e0f4;
    --mancha-3:#f4f9fe;
    --botao:#ffffff;
    --miniatura:#e3eff9;
    --azul:#7aaedb;
    --texto:#5b93c5;
    --suave:#6a9fcd;
    --sombra:rgba(47,100,150,.14);
    --serif:"Cormorant", Georgia, "Times New Roman", serif;
    --sans:"Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme:light;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:var(--fundo);
    font-family:var(--sans);color:var(--texto);
    display:flex;justify-content:center;
    padding:48px 16px;
    -webkit-font-smoothing:antialiased;
  }
  .caixa{
    width:100%;max-width:680px;min-height:calc(100vh - 96px);
    border-radius:32px;
    background:
      radial-gradient(45% 35% at 20% 18%, var(--mancha-1) 0%, transparent 70%),
      radial-gradient(40% 30% at 85% 35%, var(--mancha-2) 0%, transparent 72%),
      radial-gradient(50% 35% at 30% 75%, var(--mancha-2) 0%, transparent 72%),
      radial-gradient(45% 30% at 80% 90%, var(--mancha-3) 0%, transparent 70%),
      var(--caixa);
    box-shadow:0 30px 60px -30px var(--sombra);
    padding:64px 36px 40px;
    display:flex;flex-direction:column;align-items:center;text-align:center;
  }
  .logo{
    width:128px;height:128px;border-radius:50%;
    background:#fff;display:block;
    box-shadow:0 0 0 6px rgba(255,255,255,.7);
  }
  h1{
    margin-top:22px;
    font-family:var(--serif);font-weight:600;font-size:2.1rem;line-height:1.1;
  }
  .bio{
    margin-top:10px;max-width:34ch;
    font-size:1.08rem;line-height:1.5;color:var(--suave);
  }
  .insta{margin-top:18px;color:var(--texto);display:inline-flex;border-radius:10px}
  .insta svg{width:30px;height:30px}

  nav{width:100%;margin-top:40px;display:flex;flex-direction:column;gap:16px}
  .botao{
    position:relative;display:flex;align-items:center;justify-content:center;
    min-height:76px;padding:8px 76px;
    background:var(--botao);border-radius:14px;
    color:var(--texto);text-decoration:none;
    font-size:1.12rem;font-weight:500;
    box-shadow:0 6px 16px -10px var(--sombra);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .botao:hover{box-shadow:0 10px 22px -10px var(--sombra)}
  .botao:active{transform:scale(.985)}
  .miniatura{
    position:absolute;left:10px;top:50%;transform:translateY(-50%);
    width:58px;height:58px;border-radius:10px;background:var(--miniatura);
    display:flex;align-items:center;justify-content:center;color:var(--texto);
  }
  .miniatura svg{width:28px;height:28px}
  .botao:focus-visible,.insta:focus-visible{outline:3px solid var(--azul);outline-offset:3px}

  footer{margin-top:auto;padding-top:48px;font-family:var(--serif);font-size:1.05rem;color:var(--suave)}

  @media (max-width:480px){
    body{padding:20px 12px}
    .caixa{min-height:calc(100vh - 40px);padding:48px 18px 32px;border-radius:26px}
    .botao{padding:8px 72px;font-size:1.05rem}
  }
  @media (prefers-reduced-motion:reduce){.botao{transition:none}}
</style>
</head>
